<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Agentic AI Tutor</title>
    <script src="/static/theme-manager.js"></script>
    <style>
        :root {
            --color-primary-green: oklch(0.48 0.16 140);
            --color-accent-gold: oklch(0.56 0.13 60);
            --color-bg: oklch(1.0 0.0 0);
            --color-surface: oklch(0.97 0.0 0);
            --color-ink: oklch(0.08 0.0 0);
            --color-text-muted: oklch(0.55 0.0 0);
            --color-border: oklch(0.88 0.0 0);
            --color-error: oklch(0.52 0.16 15);
            --color-success: oklch(0.58 0.15 142);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            --radius-md: 8px;
            --radius-lg: 12px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: oklch(0.1 0.0 0);
                --color-surface: oklch(0.15 0.0 0);
                --color-ink: oklch(0.95 0.0 0);
                --color-text-muted: oklch(0.7 0.0 0);
                --color-border: oklch(0.25 0.0 0);
            }
        }
        html[data-theme="dark"] {
            --color-bg: oklch(0.1 0.0 0);
            --color-surface: oklch(0.15 0.0 0);
            --color-ink: oklch(0.95 0.0 0);
            --color-text-muted: oklch(0.7 0.0 0);
            --color-border: oklch(0.25 0.0 0);
        }
        html[data-theme="light"] {
            --color-bg: oklch(1.0 0.0 0);
            --color-surface: oklch(0.97 0.0 0);
            --color-ink: oklch(0.08 0.0 0);
            --color-text-muted: oklch(0.55 0.0 0);
            --color-border: oklch(0.88 0.0 0);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            color: var(--color-ink);
            background: linear-gradient(135deg, var(--color-primary-green), var(--color-accent-gold));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: var(--color-bg);
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand h1 { font-size: 24px; font-weight: 700; }
        .brand p { color: var(--color-text-muted); font-size: 14px; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--color-surface); padding: 4px; border-radius: var(--radius-md); }
        .tab {
            flex: 1; padding: 10px; text-align: center; cursor: pointer; border: none;
            background: transparent; color: var(--color-text-muted); font-weight: 600; font-size: 14px;
            border-radius: var(--radius-md); font-family: inherit;
        }
        .tab.active { background: var(--color-primary-green); color: #fff; }
        form { display: none; flex-direction: column; gap: 16px; }
        form.active { display: flex; }
        label { font-size: 14px; font-weight: 500; display: block; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px; border: 1px solid var(--color-border);
            border-radius: var(--radius-md); font-size: 16px; font-family: inherit;
            background: var(--color-surface); color: var(--color-ink);
        }
        input:focus { outline: 2px solid var(--color-primary-green); border-color: transparent; }
        button.submit {
            padding: 14px; border: none; border-radius: var(--radius-md); cursor: pointer;
            background: var(--color-primary-green); color: #fff; font-weight: 700; font-size: 16px;
            font-family: inherit; margin-top: 8px;
        }
        button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { padding: 12px; border-radius: var(--radius-md); font-size: 14px; display: none; }
        .msg.error { display: block; background: color-mix(in oklch, var(--color-error) 15%, transparent); color: var(--color-error); }
        .msg.success { display: block; background: color-mix(in oklch, var(--color-success) 15%, transparent); color: var(--color-success); }
        .hint { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <h1>Agentic AI Tutor</h1>
            <p>IGCSE learning, personalised for you</p>
        </div>

        <div class="tabs">
            <button class="tab active" id="tab-login" type="button">Sign In</button>
            <button class="tab" id="tab-register" type="button">Create Account</button>
        </div>

        <div class="msg" id="message"></div>

        <!-- Login -->
        <form id="login-form" class="active">
            <div>
                <label for="login-username">Username</label>
                <input type="text" id="login-username" autocomplete="username" required>
            </div>
            <div>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" autocomplete="current-password" required>
            </div>
            <button class="submit" type="submit" id="login-submit">Sign In</button>
        </form>

        <!-- Register -->
        <form id="register-form">
            <div>
                <label for="reg-fullname">Full name</label>
                <input type="text" id="reg-fullname" autocomplete="name">
            </div>
            <div>
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" autocomplete="username" required>
                <div class="hint">3–50 characters, letters and numbers only.</div>
            </div>
            <div>
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" autocomplete="email" required>
            </div>
            <div>
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" autocomplete="new-password" required>
                <div class="hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a digit.</div>
            </div>
            <button class="submit" type="submit" id="register-submit">Create Account</button>
        </form>
    </div>

    <script src="/static/auth.js"></script>
    <script>
        const message = document.getElementById('message');
        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'msg ' + type;
        }
        function clearMessage() { message.className = 'msg'; message.textContent = ''; }

        // Tab switching
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        function activate(which) {
            clearMessage();
            const isLogin = which === 'login';
            tabLogin.classList.toggle('active', isLogin);
            tabRegister.classList.toggle('active', !isLogin);
            loginForm.classList.toggle('active', isLogin);
            registerForm.classList.toggle('active', !isLogin);
        }
        tabLogin.addEventListener('click', () => activate('login'));
        tabRegister.addEventListener('click', () => activate('register'));

        // Already signed in? Go to dashboard.
        if (AUTH.isAuthenticated()) {
            window.location.href = '/dashboard';
        }

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();
            const btn = document.getElementById('login-submit');
            btn.disabled = true; btn.textContent = 'Signing in…';
            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value.trim(),
                        password: document.getElementById('login-password').value,
                    }),
                });
                const data = await resp.json();
                if (resp.ok && data.token) {
                    AUTH.setSession(data.token, data.user);
                    showMessage('Welcome back! Redirecting…', 'success');
                    const dest = (data.user && data.user.role === 'admin') ? '/admin' : '/dashboard';
                    window.location.href = dest;
                } else {
                    showMessage(data.detail || 'Invalid username or password.', 'error');
                }
            } catch (err) {
                showMessage('Could not reach the server. Please try again.', 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        });

        // Register
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();
            const btn = document.getElementById('register-submit');
            btn.disabled = true; btn.textContent = 'Creating account…';
            try {
                const resp = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('reg-username').value.trim(),
                        email: document.getElementById('reg-email').value.trim(),
                        password: document.getElementById('reg-password').value,
                        full_name: document.getElementById('reg-fullname').value.trim() || null,
                    }),
                });
                const data = await resp.json();
                if (resp.ok) {
                    showMessage('Account created! Please sign in.', 'success');
                    document.getElementById('login-username').value =
                        document.getElementById('reg-username').value.trim();
                    activate('login');
                    // Re-show success after switching tabs.
                    showMessage('Account created! Please sign in.', 'success');
                } else {
                    const detail = Array.isArray(data.detail)
                        ? data.detail.map(d => d.msg).join(' ')
                        : (data.detail || 'Registration failed.');
                    showMessage(detail, 'error');
                }
            } catch (err) {
                showMessage('Could not reach the server. Please try again.', 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
