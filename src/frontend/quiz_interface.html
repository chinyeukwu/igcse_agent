<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - IGCSE Tutor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; }
        header { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #ddd; }
        .logo { font-size: 24px; font-weight: bold; color: #4F46E5; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #4F46E5; color: white; }
        .btn-secondary { background: #f0f0f0; border: 1px solid #ddd; }
        .question-container { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .question-text { font-weight: 600; margin-bottom: 10px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; min-height: 80px; }
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Quiz</div>
            <button class="btn-secondary" onclick="window.location.href='/dashboard'">Back</button>
        </header>
        <div id="loading">Loading quiz...</div>
        <form id="quiz-form" style="display:none;">
            <div id="quiz-title" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;"></div>
            <div id="questions-container"></div>
            <div class="actions">
                <button type="button" class="btn-secondary" onclick="window.location.href='/dashboard'">Cancel</button>
                <button type="submit" class="btn-primary">Submit</button>
            </div>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const subject = params.get('subject') || 'general';
        const topic = params.get('topic') || '';
        const difficulty = params.get('difficulty') || 'medium';
        
        async function loadQuiz() {
            try {
                let query = `Create a ${difficulty} quiz`;
                if (topic) query += ` on ${topic}`;
                if (subject && subject !== 'general') query += ` for ${subject}`;
                
                const resp = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, subject, difficulty })
                });
                
                const data = await resp.json();
                const text = data.response;
                
                const questions = [];
                const regex = /\d+\.\s+([^\n]+)/g;
                let m;
                while ((m = regex.exec(text)) !== null) {
                    questions.push(m[1].trim());
                }
                
                if (questions.length === 0) {
                    document.getElementById('loading').textContent = 'No questions found.';
                    return;
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quiz-title').textContent = topic || subject || 'Quiz';
                
                const container = document.getElementById('questions-container');
                questions.forEach((q, i) => {
                    const div = document.createElement('div');
                    div.className = 'question-container';
                    div.innerHTML = `<div class="question-text">Q${i+1}: ${q}</div>
                        <textarea name="answer_${i}" placeholder="Your answer..."></textarea>`;
                    container.appendChild(div);
                });
                
                document.getElementById('quiz-form').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').textContent = 'Error: ' + e.message;
            }
        }
        
        document.getElementById('quiz-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Quiz submitted!');
            window.location.href = '/dashboard';
        });
        
        loadQuiz();
    </script>
</body>
</html>
