name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          fail=0
          # Email tests are excluded here: they require live SMTP credentials.
          for t in test_phase1 test_phase2 test_phase3 test_phase4 test_phase5 test_admin_tabs; do
            echo "::group::$t"
            python tests/$t.py
            if [ $? -ne 0 ]; then
              echo "::error::$t failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
